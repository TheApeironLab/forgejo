name: Application chart
on:
  pull_request:
    paths: ['charts/**', 'deploy/sso/**', 'release/package.py', '.github/workflows/app-chart.yml']
  push:
    branches: [main]
    paths: ['charts/**', 'deploy/sso/**', 'release/package.py', '.github/workflows/app-chart.yml']
permissions:
  contents: read
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with: {version: v3.19.0}
      - name: Lint and render the application chart
        run: |
          helm lint charts/forgejo --values charts/forgejo/values-vasi.example.yaml
          helm lint charts/forgejo --values charts/forgejo/values-vasi-oidc.example.yaml
          helm template git charts/forgejo --namespace git --values charts/forgejo/values-vasi.example.yaml > "$RUNNER_TEMP/rendered.yaml"
      - name: Check the application-owned SSO adapter
        run: PYTHONPYCACHEPREFIX="$RUNNER_TEMP/pycache" python3 -m py_compile deploy/sso/sync.py
      - name: Package immutable chart and source provenance
        run: python3 release/package.py --output "$RUNNER_TEMP/app-charts"
      - uses: actions/upload-artifact@v4
        with:
          name: forgejo-charts
          path: ${{ runner.temp }}/app-charts/
